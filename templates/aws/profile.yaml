api_version: shaula.io/template-profile/v1
kind: RunnerTemplateProfile
platform: aws
runner_backends: [github, forgejo, gitlab]
forgejo_vm_bootstrap_contract: shaula.forgejo-vm-cloud-init/v1
gitlab_vm_bootstrap_contract: shaula.gitlab-vm-cloud-init/v1
runtime:
  protocol: terraform-cli/v1
  engine: terraform
  root_module: .
  required_version: ">= 1.9, < 2.0"
bindings_contract: shaula.bindings.aws/v1
vm_image_contract: shaula.aws-ami/v1
schemas:
  bindings: schemas/bindings.schema.json
  parameters: schemas/parameters.schema.json
managed_resource_shape:
  - role: runner
    terraform_type: aws_instance
    exact_count: 1
runner_image_digests: []
runtime_policy_digest: sha256:fe26488da9dc06eebe54a71de47f39fd68cca553c6af02d65c3732ceaf32115e

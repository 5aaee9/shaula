name: Nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Package, lint and NixOS E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Require hardware virtualization
        run: |
          test -c /dev/kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      # Private-repo ubuntu-24.04 runners only guarantee a small root disk,
      # and the store plus VM builds outgrow it (the earlier failure was a
      # runner ENOSPC, not a test failure). Hosted runners expose a much
      # larger resource disk under /mnt; keep the whole Nix tree there when
      # it is a separate device. The purge is the degraded-mode budget and
      # only deletes preinstalled toolchains this workflow never invokes.
      - name: Provision disk space
        run: |
          set -euo pipefail
          root_dev=$(findmnt -no SOURCE --target /)
          mnt_dev=$(findmnt -no SOURCE --target /mnt 2>/dev/null || true)
          if [ -n "$mnt_dev" ] && [ "$mnt_dev" != "$root_dev" ]; then
            sudo mkdir -p /mnt/nix /nix
            sudo mount --bind /mnt/nix /nix
            echo "Nix tree on resource disk: $(findmnt -no SOURCE --target /nix)"
          else
            echo "No separate data disk: /nix stays on the root disk ($root_dev)"
          fi
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /opt/microsoft \
            /opt/az \
            /usr/local/share/boost \
            /usr/local/lib/node_modules \
            /usr/share/swift \
            /usr/share/miniconda
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo mkdir -p /nix/build
          df -h / /nix
          df -h /mnt 2>/dev/null || true
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            extra-experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
            build-dir = /nix/build
            max-jobs = 2
            cores = 2
      - name: Check formatting, Rust package, module and VMs
        run: nix flake check --print-build-logs

  playwright:
    name: Frontend Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Install Chromium
        run: npm exec --prefix web -- playwright install --with-deps chromium
      - name: Run Playwright suite
        run: npm test --prefix web

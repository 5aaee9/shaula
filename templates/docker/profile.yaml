api_version: shaula.io/template-profile/v1
kind: RunnerTemplateProfile
platform: docker
runtime:
  protocol: terraform-cli/v1
  engine: terraform
  root_module: .
  required_version: ">= 1.9, < 2.0"
bindings_contract: shaula.bindings.docker/v1
container_bootstrap_contract: shaula.container-bootstrap/v1
schemas:
  bindings: schemas/bindings.schema.json
  parameters: schemas/parameters.schema.json

managed_resource_shape:
  - role: runner
    terraform_type: docker_container
    exact_count: 1
runner_image_digests:
  - ghcr.io/actions/actions-runner:2.337.0@sha256:e5496277be5d09bc968b3d64911b74e219ac4a3f2edce956a3ecf9271bea1ef4
runtime_policy_digest: sha256:97fd0b28f12794d4220761923380c05bd48845658b894d01a8baade053ca09f9
